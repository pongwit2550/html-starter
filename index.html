code:`void bubble(int a[],int n){
  for(int i=0;i<n-1;i++)
    for(int j=0;j<n-1-i;j++)
      if(a[j]>a[j+1]){ int t=a[j]; a[j]=a[j+1]; a[j+1]=t; }
}
void merge(int a[],int l,int m,int r){
  int tmp[r-l+1],i=l,j=m+1,k=0;
  while(i<=m&&j<=r) tmp[k++]=a[i]<=a[j]?a[i++]:a[j++];
  while(i<=m) tmp[k++]=a[i++];
  while(j<=r) tmp[k++]=a[j++];
  for(k=0;k<r-l+1;k++) a[l+k]=tmp[k];
}
void msort(int a[],int l,int r){
  if(l>=r) return; int m=(l+r)/2;
  msort(a,l,m); msort(a,m+1,r); merge(a,l,m,r);
}`,qs:[

const hl=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/(\/\/.*)|("[^"]*")|\b(int|void|struct|if|else|for|while|return|define|char|NULL)\b|\b(\d+)\b/g,(m,c,s2,k,n)=>c?`<span class="c">${c}</span>`:s2?`<span class="s">${s2}</span>`:k?`<span class="k">${k}</span>`:`<span class="n">${n}</span>`);
/* ---------- engine (morphing = smooth animation) ---------- */
const NUM=['cx','cy','x','y','x1','y1','x2','y2','r'];
function tween(el,a,to){const from=+el.getAttribute(a);if(from===to)return;const t0=performance.now(),k='_t'+a;cancelAnimationFrame(el[k]);(function s(n){const p=Math.min(1,(n-t0)/480),e=1-Math.pow(1-p,3);el.setAttribute(a,from+(to-from)*e);if(p<1)el[k]=requestAnimationFrame(s)})(t0)}
function patch(o,n){for(const a of [...o.attributes])if(a.name!='class'&&!n.hasAttribute(a.name))o.removeAttribute(a.name);for(const a of n.attributes){if(NUM.includes(a.name)&&o.hasAttribute(a.name))tween(o,a.name,+a.value);else if(o.getAttribute(a.name)!==a.value)o.setAttribute(a.name,a.value)}kids(o,n);const x=o.firstChild,y=n.firstChild;if(x&&y&&x.nodeType==3&&y.nodeType==3&&x.data!==y.data)x.data=y.data}
function kids(o,n){const nc=[...n.children];if(!nc.length){if(o.textContent!==n.textContent)o.textContent=n.textContent;return}const od=[...o.children],km={},uk=[];od.forEach(c=>c.dataset.k?km[c.dataset.k]=c:uk.push(c));let u=0;const keep=nc.map(c=>{const k=c.dataset.k,m=k?km[k]:uk[u++];if(m&&m.tagName===c.tagName){patch(m,c);return m}c.classList.add('pop');return c});od.forEach(c=>keep.includes(c)||c.remove());keep.forEach((c,i)=>{if(o.children[i]!==c)o.insertBefore(c,o.children[i]||null)})}
let cur=0,sel=0,fr=[],ix=0,tm=null,spd=1;
$('#nav').innerHTML=T.map((t,i)=>`<button onclick="show(${i})">${IC[i]} ${t.n.replace(/^\d\s/,'')}</button>`).join('');
const mt=[[60,14],[30,50],[90,50],[15,86],[45,86],[75,86],[105,86]];
$('#mini').innerHTML=mt.map((p,i)=>i?`<line x1="${mt[(i-1)>>1][0]}" y1="${mt[(i-1)>>1][1]}" x2="${p[0]}" y2="${p[1]}" class="pop" style="animation-delay:${i*.2}s"/>`:'').join('')+mt.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="9" class="pop" style="animation-delay:${i*.2+.12}s"/>`).join('');
function show(i){cur=i;sel=0;stop();document.querySelectorAll('nav button').forEach((b,j)=>{b.classList.toggle('on',i==j);if(i==j)b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})});const t=T[i],x=X[i];
$('#app').innerHTML=`<section class="card"><h2>📖 เนื้อหา</h2><div class="an">💡 ${x[0]}</div><ul class="nt">${t.notes.map(n=>`<li>${n}</li>`).join('')}</ul><table><tr>${HD.map(h=>`<th>${h}</th>`).join('')}</tr>${x[1].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>${x[2].map(s=>`<div class="tip">⚠️ ${s}</div>`).join('')}</section>
<section class="card"><h2>🎬 Animation <small style="font-weight:400;color:var(--mut)">เลือกกรณีที่อยากดู</small></h2><div class="chips" id="chips">${A[i].map((a,j)=>`<button class="chip${j?'':' on'}" onclick="pick(${j})">${a[0]}</button>`).join('')}</div><div id="stage"></div><div class="cap fd" id="cap"></div>
<div class="ctl"><button class="b" onclick="mv(-1)">◀ ก่อนหน้า</button><button class="b p" onclick="mv(1)">ถัดไป ▶</button><button class="b" id="pl" onclick="play()">▶ เล่นอัตโนมัติ</button><select onchange="setSpd(this.value)"><option value="0.6">ช้า</option><option value="1" selected>ปกติ</option><option value="2">เร็ว</option></select></div>
<div class="ctl"><input type="range" id="sl" min="0" value="0" oninput="ix=+this.value;stop();draw()"><span class="cap" style="min-height:0;padding:2px 10px;margin:0;border:0;background:none" id="ct"></span></div></section>
<section class="card"><h2>💻 โค้ดภาษา C</h2><pre>${hl(t.code)}</pre></section>
<section class="card"><h2>📝 แบบทดสอบ <small style="font-weight:400;color:var(--mut)">Level 1–5</small></h2><div id="quiz"></div><div class="ctl"><button class="b p" onclick="grade()">ตรวจคำตอบ</button><button class="b" onclick="quiz()">ล้างคำตอบ</button><b id="score"></b></div></section>`;quiz();load()}
function quiz(){$('#quiz').innerHTML=T[cur].qs.map((q,k)=>`<div class="q"><span class="tag l">Level ${q[0]}</span><span class="tag">${q[1]}</span><br>${k+1}. ${q[2]}<div style="margin-top:4px">${q[3]?q[3].map((o,j)=>`<label class="opt"><input type="radio" name="q${k}" value="${j}"> ${o}</label>`).join(''):`<input type="text" id="q${k}" placeholder="พิมพ์คำตอบ">`}</div><div class="ex" id="e${k}"></div></div>`).join('');$('#score').textContent=''}
function pick(j){sel=j;stop();document.querySelectorAll('.chip').forEach((c,k)=>c.classList.toggle('on',k==j));load()}
function load(){fr=A[cur][sel][1]();ix=0;draw(1)}
function draw(h){const st=$('#stage'),f=fr[ix];if(h)st.innerHTML=f.h;else{const t=document.createElement('div');t.innerHTML=f.h;kids(st,t)}const c=$('#cap');c.textContent=f.c;c.classList.remove('fd');void c.offsetWidth;c.classList.add('fd');$('#sl').max=fr.length-1;$('#sl').value=ix;$('#ct').textContent=`${ix+1}/${fr.length}`}
function mv(d){ix=Math.max(0,Math.min(fr.length-1,ix+d));draw()}
function stop(){clearInterval(tm);tm=null;const p=$('#pl');if(p)p.textContent='▶ เล่นอัตโนมัติ'}
function play(){if(tm)return stop();if(ix>=fr.length-1){ix=0;draw()}$('#pl').textContent='⏸ หยุด';tm=setInterval(()=>ix<fr.length-1?mv(1):stop(),1400/spd)}
function setSpd(v){spd=+v;if(tm){stop();play()}}
document.addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(e.target.tagName))return;if(e.key=='ArrowRight')mv(1);if(e.key=='ArrowLeft')mv(-1)});
function grade(){let s=0;const t=T[cur];t.qs.forEach((q,k)=>{let ok;if(q[3]){const r=document.querySelector(`input[name=q${k}]:checked`),u=r?+r.value:-1;ok=u==q[4];document.querySelectorAll(`#quiz .q:nth-child(${k+1}) .opt`).forEach((o,j)=>{o.classList.toggle('ok',j==q[4]);o.classList.toggle('no',j==u&&!ok)})}else{ok=$('#q'+k).value.trim().replace(/\s+/g,' ').toLowerCase()==String(q[4]).toLowerCase()}if(ok)s++;$('#e'+k).innerHTML=`<span class="${ok?'good':'bad'}">${ok?'✓ ถูกต้อง':'✗ เฉลย: '+(q[3]?q[3][q[4]]:q[4])}</span> — ${q[5]}`});$('#score').textContent=`🎯 ${s}/${t.qs.length}${s==t.qs.length?' 🎉':''}`}
show(0);
</script></main></body></html>
